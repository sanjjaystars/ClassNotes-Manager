kind = "web"
previewPath = "/"
title = "ClassNotes Hub"
version = "1.0.0"
id = "artifacts/classnotes-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21663

[services.development]
run = "pnpm --filter @workspace/classnotes-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/classnotes-hub", "run", "build" ]
publicDir = "artifacts/classnotes-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21663"
BASE_PATH = "/"
